name: "PrivateLink: Resource Gateway"
description: Share an AWS or on-premises resource through VPC Lattice
title: "PrivateLink: Resource Gateway: "
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Read the [PrivateLink Guide for Requesting Teams](https://github.com/NBCUDTC/gtvd-cloud-engineering/blob/master/docs/internal/howto/aws/private-link-requesting-team-guide.md) before completing this form.

        Ensure the provider resource's security group allows `198.18.0.0/15` so VPC Lattice traffic can reach it.

  - type: markdown
    attributes:
      value: |
        ---

        ### Requester details

        Complete this section when raising the request.

  - type: input
    id: requesting-team
    attributes:
      label: Requesting team
    validations:
      required: true

  - type: input
    id: producer-account-name
    attributes:
      label: Producer AWS account name
      description: The friendly name of the account containing the resource.
    validations:
      required: true

  - type: input
    id: producer-account-id
    attributes:
      label: Producer AWS account ID
      description: The 12-digit AWS account ID containing the resource.
      placeholder: "123456789012"
    validations:
      required: true

  - type: input
    id: resource-region
    attributes:
      label: Resource AWS region
      placeholder: e.g. eu-central-1
    validations:
      required: true

  - type: input
    id: producer-vpc-name
    attributes:
      label: Producer VPC name
      description: The name of the VPC in the producer account that contains the resource. Optional; defaults to hosting.
      value: hosting
    validations:
      required: false

  - type: input
    id: consumer-account-name
    attributes:
      label: Consumer AWS account name
      description: The friendly name of the account where the endpoint will be created.
    validations:
      required: true

  - type: input
    id: consumer-account-id
    attributes:
      label: Consumer AWS account ID
      description: The 12-digit AWS account ID where the endpoint will be created.
      placeholder: "123456789012"
    validations:
      required: true

  - type: input
    id: consumer-region
    attributes:
      label: Consumer AWS region
      placeholder: e.g. us-east-2
    validations:
      required: true

  - type: input
    id: consumer-vpc-name
    attributes:
      label: Consumer VPC name
      description: The name of the one consumer VPC that needs access to the resource. Optional; defaults to hosting.
      value: hosting
    validations:
      required: false

  - type: input
    id: resource-type
    attributes:
      label: Resource type
      placeholder: e.g. RDS cluster, ElastiCache cluster, on-premises service
    validations:
      required: true

  - type: textarea
    id: resource-identifier
    attributes:
      label: Resource identifier
      description: Provide an ARN where possible. Otherwise provide the DNS endpoint or IP address.
      placeholder: ARN, DNS endpoint, or IP address
    validations:
      required: true

  - type: input
    id: ports
    attributes:
      label: Resource port(s)
      placeholder: e.g. 5432, 6379
    validations:
      required: true

  - type: dropdown
    id: region-relationship
    attributes:
      label: Region relationship
      description: Cross-region requests require additional VPC peering and split-DNS work.
      options:
        - Same region
        - Cross-region
    validations:
      required: true

  - type: dropdown
    id: private-dns
    attributes:
      label: Does the resource use private DNS?
      description: Select Yes when the hostname is not publicly resolvable, for example an ottlocal.sky name.
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: textarea
    id: timing
    attributes:
      label: Target date or timing constraint
      description: Explain when this is needed and why. If there is no fixed date, say so and provide prioritisation context.
    validations:
      required: true

  - type: textarea
    id: business-justification
    attributes:
      label: Business justification / desired outcome
      description: Explain the value, risk reduction, customer benefit, or operational outcome.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add diagrams, related issues, or other useful information.

  - type: markdown
    attributes:
      value: |
        ---

        ### Work Intake reference (optional)

        A Work Intake reference is not required to raise this issue. After review, one may be requested if the amount of effort warrants it.

  - type: input
    id: work-intake-reference
    attributes:
      label: Work Intake reference
      description: Add the link or ID if one already exists.
      placeholder: Optional

  - type: markdown
    attributes:
      value: |
        ---

        ### Operator details (completed by the assigned engineer)

        Requesting teams: leave this section blank. The assigned engineer adds the VPC ID and subnet IDs after picking up the request.

  - type: input
    id: producer-vpc-id
    attributes:
      label: Producer VPC ID
      description: The ID of the producer VPC, for example vpc-0123456789abcdef0. Optional.
      placeholder: vpc-0123456789abcdef0
    validations:
      required: false

  - type: textarea
    id: producer-subnet-ids
    attributes:
      label: Producer subnet ID(s)
      description: "Look up the subnet IDs in the producer VPC that will hold the resource gateway, one per line, in the form subnet-0123456789abcdef0. Each VPC has three servicenet subnets across zones."
      placeholder: |
        subnet-0123456789abcdef0
        subnet-0123456789abcdef1
        subnet-0123456789abcdef2
    validations:
      required: false

  - type: input
    id: consumer-vpc-id
    attributes:
      label: Consumer VPC ID
      description: The ID of the consumer VPC, for example vpc-0123456789abcdef0. Optional.
      placeholder: vpc-0123456789abcdef0
    validations:
      required: false

  - type: textarea
    id: consumer-subnet-ids
    attributes:
      label: Consumer subnet ID(s)
      description: "Look up the subnet IDs in the consumer VPC that will hold the endpoint, one per line, in the form subnet-0123456789abcdef0. Each VPC has three servicenet subnets across zones."
      placeholder: |
        subnet-0123456789abcdef0
        subnet-0123456789abcdef1
        subnet-0123456789abcdef2
    validations:
      required: false

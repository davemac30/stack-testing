name: "PrivateLink: VPC Endpoint Service"
description: Connect to an NLB exposed through an AWS VPC Endpoint Service
title: "PrivateLink: VPC Endpoint Service: "
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Read the [PrivateLink Guide for Requesting Teams](https://github.com/NBCUDTC/gtvd-cloud-engineering/blob/master/docs/internal/howto/aws/private-link-requesting-team-guide.md) before completing this form.

        The producer team must allowlist the consumer AWS account on the VPC Endpoint Service before connectivity can be established.

  - type: markdown
    attributes:
      value: |
        ## Requester details

        Complete this section when raising the request.

  - type: input
    id: requesting-team
    attributes:
      label: Requesting team
    validations:
      required: true

  - type: input
    id: producer-account-name
    attributes:
      label: Producer AWS account name
      description: The friendly name of the account that owns the VPC Endpoint Service.
    validations:
      required: true

  - type: input
    id: producer-account-id
    attributes:
      label: Producer AWS account ID
      description: The 12-digit AWS account ID that owns the VPC Endpoint Service.
      placeholder: "123456789012"
    validations:
      required: true

  - type: input
    id: consumer-account-name
    attributes:
      label: Consumer AWS account name
      description: The friendly name of the account where the endpoint will be created.
    validations:
      required: true

  - type: input
    id: consumer-account-id
    attributes:
      label: Consumer AWS account ID
      description: The 12-digit AWS account ID where the endpoint will be created.
      placeholder: "123456789012"
    validations:
      required: true

  - type: input
    id: consumer-vpcs
    attributes:
      label: Consumer VPC name(s) or ID(s)
      description: List every VPC that needs an endpoint.
      placeholder: e.g. tools, ci, vpc-0123456789abcdef0
    validations:
      required: true

  - type: input
    id: service-name
    attributes:
      label: VPC Endpoint Service name
      placeholder: com.amazonaws.vpce.us-east-2.vpce-svc-0123456789abcdef0
    validations:
      required: true

  - type: input
    id: service-region
    attributes:
      label: AWS region
      description: The region containing the VPC Endpoint Service.
      placeholder: e.g. us-east-2
    validations:
      required: true

  - type: input
    id: ports
    attributes:
      label: Service port(s)
      description: List every port the service listens on.
      placeholder: e.g. 443, 8070
    validations:
      required: true

  - type: dropdown
    id: private-dns
    attributes:
      label: Is private DNS configured on the service?
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: textarea
    id: timing
    attributes:
      label: Target date or timing constraint
      description: Explain when this is needed and why. If there is no fixed date, say so and provide prioritisation context.
    validations:
      required: true

  - type: textarea
    id: business-justification
    attributes:
      label: Business justification / desired outcome
      description: Explain the value, risk reduction, customer benefit, or operational outcome.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add diagrams, related issues, or other useful information.

  - type: markdown
    attributes:
      value: |
        ## Work Intake reference (optional)

        A Work Intake reference is not required to raise this issue. After review, one may be requested if the amount of effort warrants it.

  - type: input
    id: work-intake-reference
    attributes:
      label: Work Intake reference
      description: Add the link or ID if one already exists.
      placeholder: Optional

  - type: markdown
    attributes:
      value: |
        ---

        ## Operator details (completed by the assigned engineer)

        Requesting teams: leave this section blank. The assigned engineer adds the subnet IDs after picking up the request.

  - type: textarea
    id: consumer-subnet-ids
    attributes:
      label: Consumer subnet ID(s)
      description: "Look up the subnet IDs in the consumer VPC that will hold the endpoint, one per line, in the form subnet-0123456789abcdef0."
      placeholder: |
        subnet-0123456789abcdef0
        subnet-0123456789abcdef1
    validations:
      required: false
